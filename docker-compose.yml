services:
  postgres:
    image: postgres:17-alpine
    container_name: supercore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: supercore
      POSTGRES_PASSWORD: supercore
      POSTGRES_DB: supercore
    ports:
      - '5433:5432'
    volumes:
      - supercore-postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U supercore -d supercore']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: supercore-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - supercore-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  supercore-postgres-data:
  supercore-redis-data:
