packages:
  - 'apps/*'
  - 'packages/*'
  - 'services/*'

engineStrict: true
autoInstallPeers: true
strictPeerDependencies: false

overrides:
  graphql: 16.11.0

allowBuilds:
  esbuild: true
  msgpackr-extract: true

catalog:
  typescript: 5.9.3
  zod: 4.6.5
  drizzle-orm: 0.45.2
  drizzle-kit: 0.31.10
  postgres: 3.4.9
  bullmq: 5.61.0
  hono: 4.13.8
  '@hono/node-server': 2.1.1
  graphql: 16.11.0
  graphql-yoga: 5.24.0
  next: 16.3.4
  react: 19.3.0
  react-dom: 19.3.0
  tailwindcss: 4.3.3
  '@tailwindcss/postcss': 4.3.3
  vitest: 3.2.4
  eslint: 9.39.5
  typescript-eslint: 8.70.0
  pino: 9.9.5
  uuid: 11.1.0
  decimal.js: 10.6.0
  dotenv: 16.6.1
  tsx: 4.23.13

minimumReleaseAgeExclude:
  - '@envelop/core@5.6.1'
  - '@envelop/instrumentation@1.0.1'
  - '@envelop/types@5.2.2'
  - '@graphql-yoga/logger@2.0.2'
  - '@graphql-yoga/subscription@5.1.1'
  - '@graphql-yoga/typed-event-target@3.0.3'
  - graphql-yoga@5.24.0
