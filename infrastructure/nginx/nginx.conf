# NGINX foundation for Supercore Commerce OS.
# Placeholders only. Production domain, TLS, ports, and topology are not defined in Phase 0.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Replace these upstreams when a deployment topology is chosen.
    upstream supercore_api {
        server 127.0.0.1:4000;
    }

    upstream supercore_web {
        server 127.0.0.1:3000;
    }

    upstream supercore_admin {
        server 127.0.0.1:3001;
    }

    server {
        listen 80;
        server_name _;

        # TLS termination belongs to the future deployment architecture.
        # ssl_certificate     /etc/nginx/certs/REPLACE_ME.crt;
        # ssl_certificate_key /etc/nginx/certs/REPLACE_ME.key;

        location /health {
            proxy_pass http://supercore_api/health;
        }

        location /ready {
            proxy_pass http://supercore_api/ready;
        }

        location /live {
            proxy_pass http://supercore_api/live;
        }

        location /graphql {
            proxy_pass http://supercore_api/graphql;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Correlation-Id $http_x_correlation_id;
        }

        location /admin/ {
            proxy_pass http://supercore_admin/;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://supercore_web;
            proxy_set_header Host $host;
        }
    }
}
